name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile extension sources
        run: python -m compileall -q setup.py generator.py tests
      - name: Run contract tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
